<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ルーム対戦 | 宝石麻雀</title><link rel="stylesheet" href="chinchiro.css?build=4ff0d8e694761955"><link rel="stylesheet" href="table-online.css?build=4ff0d8e694761955"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="multiplayer-gate.css?build=4ff0d8e694761955"><script src="multiplayer-gate.js?build=4ff0d8e694761955"></script><script src="test-access-codes.js?build=4ff0d8e694761955"></script><script src="vendor/html2canvas.min.js?build=4ff0d8e694761955"></script><script src="share-capture.js?build=4ff0d8e694761955"></script><script src="social-share.js?build=4ff0d8e694761955"></script><script src="room-invite.js?build=4ff0d8e694761955"></script><meta name="houseki-build" content="4ff0d8e694761955"></head><body><header class="cc-header"><a href="home.html">‹ ホーム</a><h1 id="table-title">ルーム対戦</h1></header><main class="table-main"><p id="connection-state" role="status">名前を入力してルームを作るか、参加してください。</p><section id="remote-server" hidden><label>遠距離対戦サーバーのURL<input id="server-url" type="url" placeholder="https://…"></label><a id="connect-server" class="cc-primary" href="#">このサーバーで開く</a><p>ルームと出目・対局進行を管理するサーバーが必要です。接続先は参加者全員で揃えてください。</p></section>
<section id="join-form" class="table-card"><label>名前<input id="online-name" maxlength="16" autocomplete="nickname" required></label><label>合言葉<input id="room-code" maxlength="8" autocapitalize="characters" autocomplete="off"></label><button id="create-room" disabled>オーナーになる・ルーム作成</button><button id="join-room" disabled>参加する</button></section>
<section id="nearby-connection" class="table-card" hidden><h2>端末を直接つなぐ</h2><p>同じWi-Fiまたは接続可能なVPNで使用します。オーナーは画面を開いたままにしてください。</p><p id="nearby-status" role="status"></p><div id="host-controls" hidden><button id="make-invite">招待情報を作る</button><button id="apply-answer">応答を適用</button></div><label>相手から受け取った接続情報<textarea id="nearby-input" rows="3"></textarea></label><button id="make-answer">招待から応答を作る</button><label>相手へ渡す接続情報<textarea id="nearby-output" rows="3" readonly></textarea></label><button id="copy-nearby">コピー</button><button id="share-nearby">ファイルで共有</button><label>接続ファイルを読む<input id="import-nearby" type="file" accept=".txt,.json"></label></section>
<section id="room-info" class="table-card" hidden><h2 id="room-title"></h2><div id="room-members"></div><div id="host-settings"><fieldset id="chinchiro-settings" hidden><legend>チンチロのルール</legend><label>振り方<select id="table-dice-mode"><option value="normal">通常（3個）</option><option value="reach">リーチ（2個→1個）</option></select></label><label>同役<select id="table-dice-tie"><option value="parent">親勝ち</option><option value="push">トントン</option></select></label><label>精算<select id="table-dice-settlement"><option value="classic">通常方式</option><option value="compare">双方の役を比較</option></select></label><label>初期枚数<input id="table-initial" type="number" value="1000" min="0" max="1000000000"></label><label>基本の賭け枚数<input id="table-stake" type="number" value="10" min="1" max="1000000"></label><label>親番は何周する？（1〜20周）<input id="table-laps" type="number" value="1" min="1" max="20"></label><p>各人が指定した回数だけ親を担当します。設定を保存してから開始してください。</p></fieldset><fieldset id="sanma-settings" hidden><legend>五等サンマのルール</legend><label>プリセット<select id="table-sanma-preset"><option value="general">一般ルール</option><option value="house">身内ルール（華4シュバ五等）</option><option value="saved">この端末のひとり対局の設定</option></select></label><p>開始前に全員へ採用ルールを表示します。細かい設定は、ひとり対局のルール設定を保存してから「この端末の設定」を選べます。</p><label>空席CPU<select id="table-cpu"><option value="beginner">やさしい</option><option value="standard" selected>標準</option><option value="expert">強い</option></select></label></fieldset><button id="apply-table-settings">設定を保存（全員の準備を解除）</button></div><details><summary>このルームの採用ルール</summary><pre id="room-rules"></pre></details><button id="ready-room">準備完了</button><button id="start-room">対局開始</button><button id="forget-room">この端末の参加情報を消す</button></section>
<section id="table-game" hidden><p id="table-status" role="status"></p><div id="table-board"></div><div id="table-actions"></div><section id="table-round" class="table-card" hidden></section><button id="table-next" hidden>確認して次へ</button><button id="table-again" hidden>次の対局を準備</button><button id="table-copy">結果をコピー</button><p id="table-save-status" role="status"></p></section><p><a href="table-connection-guide.html">接続マニュアル</a></p></main><script src="result-text.js?build=4ff0d8e694761955"></script><script src="chinchiro-core.js?build=4ff0d8e694761955"></script><script src="engine.bundle.js?build=4ff0d8e694761955"></script><script src="table-online.js?build=4ff0d8e694761955" type="module"></script><script src="pwa.js?build=4ff0d8e694761955"></script></body></html>
