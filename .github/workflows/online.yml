name: Online room integration
on:
  push:
    branches: [codex/offline-android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/bundle.js
      - run: npm install --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=60000 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-online.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houseki-online-preview
          path: houseki-online-*.png
